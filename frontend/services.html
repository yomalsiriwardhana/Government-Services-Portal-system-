<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Services - Gov Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }

        /* Modern Navbar */
        .navbar-modern {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1rem 0;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }

        .navbar-modern .navbar-brand {
            color: white;
            font-weight: 700;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .navbar-modern .nav-link {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        .navbar-modern .nav-link:hover,
        .navbar-modern .nav-link.active {
            color: white;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Hero Header */
        .page-hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 4rem 0 3rem;
            margin-bottom: -2rem;
            position: relative;
            overflow: hidden;
        }

        .page-hero::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -200px;
            right: -100px;
        }

        .page-hero::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            bottom: -50px;
            left: 10%;
        }

        .page-hero h1 {
            color: white;
            font-weight: 800;
            font-size: 2.5rem;
            position: relative;
            z-index: 1;
        }

        .page-hero p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }

        /* Main Content */
        .main-content {
            position: relative;
            z-index: 10;
            padding-top: 2rem;
        }

        /* Filter Card */
        .filter-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            margin-bottom: 2rem;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .form-select,
        .form-control {
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-select:focus,
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        /* Modern Service Card */
        .service-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
            border: 1px solid rgba(0, 0, 0, 0.03);
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.15);
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .service-icon {
            font-size: 3rem;
            margin-bottom: 1.25rem;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .service-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #1a1a2e;
        }

        .service-description {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .service-meta {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .service-meta .badge {
            background: linear-gradient(135deg, #f0f0ff 0%, #e8e8ff 100%);
            color: #667eea;
            font-weight: 500;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
        }

        /* Language Switcher */
        .language-switcher {
            display: flex;
            gap: 0.5rem;
        }

        .lang-btn {
            padding: 0.4rem 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 0.85rem;
            color: white;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .lang-btn.active {
            background: white;
            color: #667eea;
            border-color: white;
        }

        /* Modal Styles */
        #serviceModal {
            display: none;
            position: fixed;
            z-index: 1050;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            overflow: auto;
        }

        #serviceModal>div {
            background: white;
            margin: 40px auto;
            max-width: 900px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 1px solid #e5e7eb;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 24px 24px 0 0;
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .modal-body {
            padding: 2rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        .modal-body h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #1a1a2e;
            padding-left: 1rem;
            border-left: 4px solid #667eea;
        }

        .modal-footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7280;
            transition: color 0.3s;
        }

        .btn-close:hover {
            color: #1a1a2e;
        }

        /* Footer */
        .footer-modern {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 2rem 0;
            margin-top: 4rem;
        }

        .footer-modern a {
            color: #94a3b8;
            transition: color 0.3s;
        }

        .footer-modern a:hover {
            color: #667eea;
        }

        /* Loading */
        .spinner-border {
            color: #667eea !important;
        }

        @media (max-width: 768px) {
            .page-hero h1 {
                font-size: 1.8rem;
            }

            .service-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-modern">
        <div class="container">
            <a class="navbar-brand" href="/index.html">
                <i class="fas fa-landmark"></i> Gov Portal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="/index.html" data-i18n="nav_home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/services.html" data-i18n="nav_services">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard-enhanced.html" data-i18n="nav_dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item ms-3">
                        <div class="language-switcher">
                            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
                            <button class="lang-btn" data-lang="si" onclick="setLanguage('si')">සිං</button>
                            <button class="lang-btn" data-lang="ta" onclick="setLanguage('ta')">த</button>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Header -->
    <section class="page-hero">
        <div class="container text-center">
            <h1 data-i18n="services_title"><i class="fas fa-building-columns me-2"></i>Government Services</h1>
            <p class="mb-0" data-i18n="services_subtitle">Browse and search all available government services</p>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container main-content">
        <!-- Filter Card -->
        <div class="filter-card">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-semibold" data-i18n="services_filter">
                        <i class="fas fa-filter me-1 text-primary"></i>Filter by Category:
                    </label>
                    <select id="categoryFilter" class="form-select">
                        <option value="" data-i18n="services_all_categories">All Categories</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label class="form-label fw-semibold" data-i18n="services_search">
                        <i class="fas fa-search me-1 text-primary"></i>Search Services:
                    </label>
                    <div class="input-group">
                        <input type="text" id="searchInput" class="form-control" data-i18n="services_search_placeholder"
                            placeholder="Search services...">
                        <button id="searchBtn" class="btn btn-primary" data-i18n="services_search_btn">
                            <i class="fas fa-search me-1"></i>Search
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Services Grid -->
        <div id="servicesGrid" class="row g-4">
            <div class="col-12 text-center py-5">
                <div class="spinner-border" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted" data-i18n="services_loading">Loading services...</p>
            </div>
        </div>
    </div>

    <!-- Service Details Modal -->
    <div id="serviceModal"></div>

    <!-- Footer -->
    <footer class="footer-modern">
        <div class="container text-center">
            <div class="mb-2">
                <i class="fas fa-landmark me-2" style="color: #667eea;"></i>
                <span class="fw-bold">Government Portal</span>
            </div>
            <p class="mb-0 text-muted" data-i18n="footer_text">© 2025 Government Services Portal - Sri Lanka. All rights
                reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/translations.js"></script>
    <script src="/js/services.js"></script>
</body>

</html>
